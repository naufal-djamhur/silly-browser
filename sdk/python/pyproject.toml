[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "silly-browser"
version = "0.1.0"
description = "Experimental source-patched Chromium with Python automation APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{name = "silly-browser contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
requires-python = ">=3.10"
dependencies = ["playwright==1.62.0"]

[project.optional-dependencies]
compatibility = ["selenium==4.51.0"]
fonts = ["silly-browser-fonts==0.1.0"]

[project.urls]
Homepage = "https://github.com/naufal-djamhur/silly-browser"
Repository = "https://github.com/naufal-djamhur/silly-browser"
Issues = "https://github.com/naufal-djamhur/silly-browser/issues"

[project.scripts]
silly-browser = "silly_browser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_browser*", "silly_browser*"]

[tool.setuptools.package-data]
custom_browser = ["releases.json"]
