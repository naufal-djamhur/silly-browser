name: Bug report
description: Report a reproducible browser or SDK defect
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: SDK/native version, OS/architecture, driver/version and headed/headless mode. Remove private data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps or a small script using a public/local fixture. Do not include credentials or personal profiles.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
