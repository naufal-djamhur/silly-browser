name: SDK and package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e packages/fonts -e sdk/python build twine
      - run: npm test
      - run: npm run test:installer
      - run: python -m unittest discover -s tests -p python_sdk_contract_test.py
      - run: python -m unittest discover -s tests -p python_browser_manager_test.py
      - run: python -m unittest discover -s tests -p browser_catalog_test.py
      - run: python -m unittest discover -s tests -p python_font_pack_test.py
      - run: npm pack --dry-run
      - run: python -m build sdk/python --outdir dist
      - run: npm pack ./packages/fonts --dry-run
      - run: python -m build packages/fonts --outdir dist
      - run: python -m twine check dist/*
